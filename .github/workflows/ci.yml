name: CI

on:
  push:
    branches: [main, master, "go-to-work", "chore/**", "feat/**"]
  pull_request:
    branches: [main, master, "go-to-work"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn bootstrap:bootstrap

      - name: Build (fast path)
        run: yarn bootstrap:build:fast

      - name: Build (full bootstrap)
        run: yarn bootstrap:build

      - name: Typecheck plugin-core
        run: yarn workspace @dendronhq/plugin-core compile

      - name: Doctor smoke (8 contracts)
        run: yarn test:doctor:smoke

      - name: Modernization verify script
        run: yarn verify:modernization

  cli-tests:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install and build
        run: |
          yarn bootstrap:bootstrap
          yarn bootstrap:buildCI

      - name: CLI smoke tests
        run: yarn ci:test:cli:smoke

      - name: CLI full suite (informational)
        run: yarn ci:test:cli
        continue-on-error: true