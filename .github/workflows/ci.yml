# Personal fork CI: local extension viability only (no npm publish).
name: CI

on:
  push:
    branches: [main, master, "go-to-work", "chore/**", "feat/**"]
  pull_request:
    branches: [main, master, "go-to-work"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-local-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn bootstrap:bootstrap

      - name: Local extension verify (fast bootstrap + plugin-core tsc)
        run: yarn verify:local

      - name: Full verify (CI bootstrap + doctor + CLI smoke)
        run: yarn verify:full

      - name: Full monorepo build (plugin-views + sync_assets)
        run: yarn bootstrap:build

      - name: CLI integration tests (informational)
        run: yarn ci:test:cli
        continue-on-error: true